<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>分工台 · 多模型协作</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"
        ><img class="brand-logo" src="/logo.png" alt="分工台标志" /><span
          >分工台<small>效果优先 · 按需协作</small></span
        ></a
      >
      <div class="nav-label">工作空间</div>
      <nav id="nav">
        <button data-page="dashboard" class="active">
          <span data-icon="grid"></span>配置总览</button
        ><button data-page="models">
          <span data-icon="box"></span>模型配置<span
            class="nav-count"
            id="model-count"
            >0</span
          ></button
        ><button data-page="rules">
          <span data-icon="sliders"></span>分工规则</button
        ><button data-page="history">
          <span data-icon="clock"></span>执行记录
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-note">
          <span class="status-dot"></span>本地运行<small
            >密钥保存在你的电脑上</small
          >
        </div>
        <button class="connect-nav" data-page="connect">
          <span data-icon="plug"></span>连接 Codex<span>↗</span>
        </button>
        <div class="sidebar-footer">多模型协作 <span>v2.0</span></div>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          工作空间 <span>/</span> <b id="crumb">配置总览</b>
        </div>
        <div class="top-right">
          <span class="local-badge"><i></i> 本地私有</span
          ><button
            class="icon-button"
            id="help"
            aria-label="使用说明"
            title="使用说明"
          >
            ?
          </button>
        </div>
      </header>
      <main id="main"></main>
      <footer class="page-footer">
        <span>每一次分工，都清晰可见。</span
        ><span>运行于 127.0.0.1 · 密钥不会返回浏览器</span>
      </footer>
    </div>
    <dialog id="model-dialog">
      <form id="model-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">模型连接</span>
            <h2 id="dialog-title">添加模型</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            id="close-dialog"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <input type="hidden" name="id" />
        <div class="form-grid">
          <label
            >显示名称<input
              name="name"
              required
              maxlength="80"
              placeholder="例如：日常代码助手" /></label
          ><label
            >模型档次<select name="tier">
              <option value="low">低价 · 轻量任务</option>
              <option value="standard" selected>均衡 · 日常开发</option>
              <option value="strong">高能力 · 复杂问题</option>
            </select></label
          >
        </div>
        <label
          >调用方式<select name="kind">
            <option value="api">外部模型接口</option>
            <option value="codex">Codex 已有登录</option>
            <option value="codex-provider">独立 Codex 服务商</option>
          </select></label
        ><label
          >擅长的任务（供总指挥参考）<input
            name="hint"
            maxlength="240"
            placeholder="可留空，不绑定固定步骤" /></label
        ><label
          >接口协议<select name="protocol">
            <option value="openai">OpenAI 兼容接口</option>
            <option value="anthropic">Anthropic 原生接口</option>
          </select></label
        ><label
          >接口地址<input
            name="baseUrl"
            type="url"
            required
            placeholder="https://你的服务商地址/v1"
          /><small
            >填写基础地址，通常以 /v1 结尾，不需要填写
            /chat/completions。</small
          ></label
        ><label
          >模型 ID<input
            name="model"
            required
            placeholder="填写服务商提供的准确模型名称"
            maxlength="120" /></label
        ><label
          >API key
          <div class="secret-field">
            <input
              name="apiKey"
              type="password"
              autocomplete="new-password"
              placeholder="仅在本机加密保存；本地模型可留空"
            /><button type="button" id="toggle-key" aria-label="显示或隐藏密钥">
              显示
            </button>
          </div>
          <small id="key-hint"
            >保存后不回显。编辑时留空可保留原密钥。</small
          ></label
        >
        <details class="price-details">
          <summary>费用估算（选填）</summary>
          <p class="muted small">
            按服务商公布的美元价格填写；未填写时显示「未计价」。
          </p>
          <div class="form-grid">
            <label
              >输入 / 百万词元（美元）<input
                name="inputPrice"
                type="number"
                min="0"
                step="any"
                placeholder="未填写" /></label
            ><label
              >输出 / 百万词元（美元）<input
                name="outputPrice"
                type="number"
                min="0"
                step="any"
                placeholder="未填写"
            /></label>
          </div>
        </details>
        <label class="check-line"
          ><input type="checkbox" name="enabled" checked />启用这个模型</label
        >
        <div id="form-error" class="form-error" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" class="button secondary" id="cancel-dialog">
            取消</button
          ><button class="button primary" type="submit">保存模型</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
